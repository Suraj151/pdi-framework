sentence=Portable Device Interface (PDI) is a C++ framework that boots your device into a tiny OS: a shell over serial, Telnet and SSH, a web portal, SFTP, MQTT, OTA updates, cron, users and files.
paragraph=Flash one sketch and the device comes up with a login shell that has 75+ commands, pipes and scripts, a web portal with users and permissions, a filesystem with /proc, /sys, /dev and /tmp, SD cards, MQTT, OTA updates over WiFi and cron jobs. Each device gets the services its hardware can carry, and your own code runs alongside them.
